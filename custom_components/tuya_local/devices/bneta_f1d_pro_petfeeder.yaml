name: Pet feeder
products:
  - id: xydcm0eb79u2ngeg
    manufacturer: BNETA
    model: F1-D Pro
entities:
  - entity: switch
    translation_key: watermark
    category: config
    dps:
      - id: 104
        type: boolean
        optional: true
        name: switch
  - entity: switch
    name: Camera privacy
    category: config
    dps:
      - id: 105
        type: boolean
        optional: true
        name: switch
  - entity: select
    translation_key: motion_sensitivity
    category: config
    dps:
      - id: 106
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "0"
            value: low
          - dps_val: "1"
            value: medium
          - dps_val: "2"
            value: high
  - entity: select
    translation_key: night_vision
    category: config
    dps:
      - id: 108
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "0"
            value: auto
          - dps_val: "1"
            value: "off"
          - dps_val: "2"
            value: "on"
  - entity: event
    class: motion
    dps:
      - id: 115
        type: base64
        name: event
        optional: true
        mapping:
          - dps_val: null
            value: null
          - value: detected
      - id: 115
        type: base64
        name: snapshot
        optional: true
  - entity: switch
    name: Motion detection
    icon: "mdi:motion-sensor"
    category: config
    dps:
      - id: 134
        type: boolean
        optional: true
        name: switch
        mapping:
          - dps_val: null
            value: false
            hidden: true
  - entity: event
    name: Notification
    dps:
      - id: 212
        type: utf16b64
        name: event
        optional: true
        mapping:
          - dps_val: null
            value: null
          - value: message
      - id: 212
        type: utf16b64
        name: message
        optional: true
  - entity: number
    translation_key: manual_feed
    dps:
      - id: 231
        type: integer
        optional: true
        name: value
        unit: portions
        range:
          min: 1
          max: 10
  - entity: number
    name: Meal plan number
    category: config
    icon: "mdi:calendar-clock"
    hidden: true
    dps:
      - id: 232
        type: integer
        optional: true
        name: value
        range:
          min: 1
          max: 10
  - entity: number
    name: Voice recording
    category: config
    icon: "mdi:account-voice"
    hidden: true
    dps:
      - id: 234
        type: integer
        optional: true
        name: value
        range:
          min: 0
          max: 3
  - entity: binary_sensor
    name: Factory reset
    category: diagnostic
    dps:
      - id: 236
        type: boolean
        optional: true
        name: sensor
        mapping:
          - dps_val: null
            value: false
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 237
        type: integer
        optional: true
        name: sensor
        unit: "%"
        class: measurement
  - entity: binary_sensor
    class: battery
    category: diagnostic
    dps:
      - id: 238
        type: integer
        optional: true
        name: sensor
        mapping:
          - dps_val: 8
            value: true
          - value: false
  - entity: sensor
    name: Feed state
    class: enum
    icon: "mdi:food-drumstick"
    dps:
      - id: 239
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: standby
            value: Standby
          - dps_val: feeding
            value: Feeding
          - dps_val: done
            value: Done
  - entity: sensor
    name: Feed record
    category: diagnostic
    icon: "mdi:history"
    dps:
      - id: 241
        type: string
        optional: true
        name: sensor
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 242
        type: string
        optional: true
        name: value
  - entity: sensor
    name: Alarm
    class: enum
    category: diagnostic
    dps:
      - id: 243
        type: integer
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: Normal
          - dps_val: 2
            value: No food
          - dps_val: 3
            value: Blocked
          - dps_val: 4
            value: Device error
          - dps_val: 5
            value: Clear alarm
          - dps_val: 6
            value: Motor jam
          - dps_val: 8
            value: Overflow
  - entity: button
    class: restart
    category: config
    dps:
      - id: 245
        type: integer
        optional: true
        name: button
        mapping:
          - dps_val: 1
            value: true
          - value: false
  - entity: text
    name: Indicator state
    category: config
    icon: "mdi:led-on"
    hidden: true
    dps:
      - id: 247
        type: string
        optional: true
        name: value
  - entity: number
    name: Portion weight
    category: config
    icon: "mdi:weight"
    dps:
      - id: 249
        type: integer
        optional: true
        name: value
        range:
          min: 1
          max: 10
  - entity: select
    name: Spill prevention
    category: config
    icon: "mdi:bowl-mix"
    dps:
      - id: 250
        type: integer
        optional: true
        name: option
        mapping:
          - dps_val: 0
            value: Disabled
          - dps_val: 1
            value: "Off"
          - dps_val: 21
            value: Low
          - dps_val: 22
            value: Medium
          - dps_val: 23
            value: Full
  - entity: number
    translation_key: volume
    category: config
    dps:
      - id: 251
        type: integer
        optional: true
        name: value
        unit: "%"
        range:
          min: -1
          max: 100
